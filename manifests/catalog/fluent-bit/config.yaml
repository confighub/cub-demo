apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: logging
data:
  region: us-east-1
  fluent-bit.conf: |
    [SERVICE]
        Flush         5
        Log_Level     info
        Parsers_File  parsers.conf
    [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        Parser            cri
        Tag               kube.*
        Mem_Buf_Limit     50MB
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Merge_Log           On
    [OUTPUT]
        Name                cloudwatch_logs
        Match               kube.*
        log_group_name      /{{.Scenario.Name}}/cluster
        log_stream_prefix   fb-
        auto_create_group   true
