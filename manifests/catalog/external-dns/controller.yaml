apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
  namespace: external-dns
  labels:
    app.kubernetes.io/name: external-dns
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: external-dns
  template:
    metadata:
      labels:
        app.kubernetes.io/name: external-dns
    spec:
      serviceAccountName: external-dns
      containers:
        - name: external-dns
          image: registry.k8s.io/external-dns/external-dns:{{.Values.version}}
          args:
            - --source=service
            - --source=ingress
            - --provider=aws
            - --registry=txt
            - --policy=upsert-only
            - --interval=1m
          env:
            - name: EXTERNAL_DNS_DOMAIN_FILTER
              value: "{{.Scenario.Domain}}"
            - name: EXTERNAL_DNS_TXT_OWNER_ID
              value: "{{.Scenario.Name}}"
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 128Mi
