# The company secret store: AWS Secrets Manager, IRSA-authenticated. Region is
# set per deployment by the seeder.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: "{{.Scenario.Name}}-secrets"
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
