apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: catalog-api
  namespace: catalog-api
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: traefik-security-headers@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: ["api.{{.Scenario.Domain}}"]
      secretName: catalog-api-tls
  rules:
    - host: api.{{.Scenario.Domain}}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: catalog-api-api
                port: {name: http}
