apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront-web
  namespace: storefront
  labels:
    app.kubernetes.io/name: storefront
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: storefront
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: storefront
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storefront
        app.kubernetes.io/component: web
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: web
          image: registry.{{.Scenario.Domain}}/storefront/web:{{.Values.version}}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LOG_LEVEL
              value: debug
            - name: AWS_REGION
              value: us-east-1
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: 3.4.2-conn
                  key: endpoint
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: storefront-web
  namespace: storefront
spec:
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app.kubernetes.io/name: storefront
    app.kubernetes.io/component: web
