apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipment-tracker-tracker
  namespace: shipment-tracker
  labels:
    app.kubernetes.io/name: shipment-tracker
    app.kubernetes.io/component: tracker
    app.kubernetes.io/part-of: shipment-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shipment-tracker
      app.kubernetes.io/component: tracker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shipment-tracker
        app.kubernetes.io/component: tracker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      containers:
        - name: tracker
          image: registry.{{.Scenario.Domain}}/shipment-tracker/tracker:{{.Values.version}}
          ports:
            - name: http
              containerPort: 9090
          env:
            - name: LOG_LEVEL
              value: debug
            - name: AWS_REGION
              value: us-east-1
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: 6.4.1-conn
                  key: endpoint
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: shipment-tracker-tracker
  namespace: shipment-tracker
spec:
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app.kubernetes.io/name: shipment-tracker
    app.kubernetes.io/component: tracker
