apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-api
  namespace: ledger
  labels:
    app.kubernetes.io/name: ledger
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: ledger
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ledger
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ledger
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: api
          image: registry.{{.Scenario.Domain}}/ledger/api:{{.Values.version}}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LOG_LEVEL
              value: debug
            - name: AWS_REGION
              value: us-east-1
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: 3.3.7-conn
                  key: endpoint
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ledger-api
  namespace: ledger
spec:
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app.kubernetes.io/name: ledger
    app.kubernetes.io/component: api
